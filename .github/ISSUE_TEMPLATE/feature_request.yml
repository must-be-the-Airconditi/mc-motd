name: 功能建议
description: 想要新功能、新输出格式、新平台支持
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说场景比说方案更有用
      placeholder: 我想同时在网页上对比几个服务器的 MOTD
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 支持 `motd a.com b.com --compare`，并排显示
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与
      options:
        - label: 我愿意提 PR
          required: false
