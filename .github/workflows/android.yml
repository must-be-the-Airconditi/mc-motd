name: android

on:
  push:
    branches: [main]
    tags: ['gui-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=未配置签名密钥::仓库 Secrets 缺少 ANDROID_KEYSTORE_BASE64，无法签名 APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mcmotd.keystore"
      - name: Build release APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          cat > local.properties <<PROPS
          sdk.dir=$ANDROID_HOME
          mcmotd.storeFile=$RUNNER_TEMP/mcmotd.keystore
          mcmotd.storePassword=$KS
          mcmotd.keyAlias=$KA
          mcmotd.keyPassword=$KP
          PROPS
          VERSION=$(grep -oP 'VERSION = "\K[0-9.]+' ../gui/src/mcmotd/Main.java)
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          gradle :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mc-motd-android-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/mc-motd-android-*.apk
      - name: Attach to GUI release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'VERSION = "\K[0-9.]+' gui/src/mcmotd/Main.java)
          gh release upload "gui-v$VERSION" "$RUNNER_TEMP/mc-motd-android-$VERSION.apk" --clobber
