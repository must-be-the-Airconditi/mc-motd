name: gui

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包、不发布（试跑用）'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['gui-v*']
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'

permissions:
  contents: write

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 编译 + 打 jar
        shell: bash
        run: bash gui/build.sh

  package:
    name: ${{ matrix.name }}
    needs: compile
    if: startsWith(github.ref, 'refs/tags/gui-v') || inputs.dry_run
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 计算版本
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#gui-v}"
          # 非 tag 触发（dry-run）时 ref 是 main 之类，jpackage 只收 1~3 段数字
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            version=$(sed -n 's/.*VERSION = "\([0-9][0-9.]*\)".*/\1/p' gui/src/mcmotd/Main.java | head -1)
          fi
          [ -n "$version" ] || version="0.0.0"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本: $version"

      - name: 编译 GUI
        shell: bash
        run: bash gui/build.sh

      - name: 打包 Linux + 通用 portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version "$APP_VERSION" --icon gui/icon.png --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          tar -czf "release/mc-motd-${APP_VERSION}-linux-x64.tar.gz" -C release mc-motd

          mkdir -p portable/mc-motd
          cp gui/dist/mc-motd-gui.jar portable/mc-motd/
          cp gui/launcher/mc-motd portable/mc-motd/
          cp gui/launcher/mc-motd.bat portable/mc-motd/
          cp gui/icon.png portable/mc-motd/
          chmod +x portable/mc-motd/mc-motd
          (cd portable && zip -qr "../release/mc-motd-${APP_VERSION}-portable.zip" mc-motd)

      - name: 准备 Windows 图标
        if: runner.os == 'Windows'
        shell: bash
        run: node gui/tools/png-to-ico.js gui/icon.png icon.ico

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version "$APP_VERSION" --icon icon.ico --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          powershell -NoProfile -Command "Compress-Archive -Path release/mc-motd -DestinationPath release/mc-motd-${APP_VERSION}-windows-x64.zip"

      - name: 生成 macOS 图标
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" gui/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s * 2))" "$((s * 2))" gui/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -l icon.icns

      - name: 打包 macOS（.app zip + dmg）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version "$APP_VERSION" --icon icon.icns --dest release \
            --mac-package-identifier dev.mcmotd.gui \
            --java-options "-Dfile.encoding=UTF-8"
          ditto -c -k --sequesterRsrc --keepParent "release/mc-motd.app" \
            "release/mc-motd-${APP_VERSION}-macos-arm64.zip"
          jpackage --type dmg --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version "$APP_VERSION" --icon icon.icns --dest release \
            --mac-package-identifier dev.mcmotd.gui \
            --java-options "-Dfile.encoding=UTF-8"
          ls -lh release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.dmg
          if-no-files-found: error

      - name: 上传通用 jar
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: gui/dist/mc-motd-gui.jar
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 release notes
        shell: bash
        run: node tools/release-notes.js --tag "$GITHUB_REF_NAME" --footer .github/release-footer-gui.md > release-notes.md

      - name: 生成校验和
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          body_path: release-notes.md
          files: artifacts/**
