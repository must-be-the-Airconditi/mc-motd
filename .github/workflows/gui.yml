name: gui

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['gui-v*']
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui.yml'

permissions:
  contents: write

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 编译 + 打 jar
        shell: bash
        run: bash gui/build.sh

  package:
    name: ${{ matrix.name }}
    needs: compile
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 编译 GUI
        shell: bash
        run: bash gui/build.sh

      - name: 打包 Linux + 通用 portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version 1.1.0 --icon gui/icon.png --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          tar -czf release/mc-motd-1.1.0-linux-x64.tar.gz -C release mc-motd

          mkdir -p portable/mc-motd
          cp gui/dist/mc-motd-gui.jar portable/mc-motd/
          cp gui/launcher/mc-motd portable/mc-motd/
          cp gui/launcher/mc-motd.bat portable/mc-motd/
          cp gui/icon.png portable/mc-motd/
          chmod +x portable/mc-motd/mc-motd
          (cd portable && zip -qr ../release/mc-motd-1.1.0-portable.zip mc-motd)

      - name: 准备 Windows 图标
        if: runner.os == 'Windows'
        shell: bash
        run: node gui/tools/png-to-ico.js gui/icon.png icon.ico

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version 1.1.0 --icon icon.ico --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          powershell -NoProfile -Command "Compress-Archive -Path release/mc-motd -DestinationPath release/mc-motd-1.1.0-windows-x64.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

      - name: 上传通用 jar
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: gui/dist/mc-motd-gui.jar
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          body_path: .github/release-notes-gui.md
          files: artifacts/**
