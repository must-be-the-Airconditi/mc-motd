name: release-gui

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: release/*.tar.gz
          - name: windows-x64
            os: windows-latest
            artifact: release/*.zip
          - name: macos-x64
            os: macos-13
            artifact: release/*.dmg
          - name: macos-arm64
            os: macos-14
            artifact: release/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 编译 GUI
        shell: bash
        run: bash gui/build.sh

      - name: 准备图标
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node gui/tools/png-to-ico.js gui/icon.png icon.ico
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s gui/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s * 2)) $((s * 2)) gui/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns icon.iconset -o icon.icns
          fi

      - name: 打包 Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version 1.1.0 --icon gui/icon.png --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          tar -czf release/mc-motd-1.1.0-linux-x64.tar.gz -C release mc-motd

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version 1.1.0 --icon icon.ico --dest release \
            --java-options "-Dfile.encoding=UTF-8"
          powershell -NoProfile -Command "Compress-Archive -Path release/mc-motd -DestinationPath release/mc-motd-1.1.0-windows-x64.zip"

      - name: 打包 macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type dmg --name mc-motd \
            --input gui/dist --main-jar mc-motd-gui.jar --main-class mcmotd.Main \
            --app-version 1.1.0 --icon icon.icns --dest release \
            --mac-package-name "MOTD Viewer" \
            --java-options "-Dfile.encoding=UTF-8"
          arch="$(uname -m)"
          mv "release/mc-motd-1.1.0.dmg" "release/mc-motd-1.1.0-macos-${arch}.dmg"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: 上传通用 jar
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: gui/dist/mc-motd-gui.jar
          if-no-files-found: error

  publish:
    name: publish pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body_path: .github/release-notes-gui.md
          files: artifacts/**
