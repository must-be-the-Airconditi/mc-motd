<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOTD 查看器 · Minecraft Java</title>
  <meta name="description" content="在线查看 Minecraft Java 版服务器的 MOTD、版本、在线人数和延迟。直连服务器列表 Ping 协议。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23386a20'/%3E%3Cpath d='M6 11h20v4H6z' fill='%23b7f397'/%3E%3Cpath d='M6 15h20v11H6z' fill='%237c5a3c'/%3E%3Cpath d='M11 19v3M17 20v3M23 19v3' stroke='%235a3f28' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    // 首屏前先上主题 class，避免深色/彩色主题闪一下浅色
    (function () {
      try {
        var themes = ['auto', 'light', 'dark', 'mocha', 'latte'];
        var fromUrl = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('mc-motd:theme');
        var theme = themes.indexOf(fromUrl) >= 0 ? fromUrl : (themes.indexOf(saved) >= 0 ? saved : 'auto');
        var cls = document.documentElement.classList;
        var dark = theme === 'dark' || theme === 'mocha'
          || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) cls.add('dark-palette');
        if (theme === 'mocha') cls.add('theme-mocha');
        if (theme === 'latte') cls.add('theme-latte');
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="草方块">
            <rect width="32" height="32" rx="4" fill="#386a20"/>
            <path d="M5 10h22v5H5z" fill="#b7f397"/>
            <path d="M5 14h22v2H5z" fill="#8dd86a"/>
            <path d="M5 16h22v12H5z" fill="#7c5a3c"/>
            <path d="M9 20v3M15 21v4M21 20v3" stroke="#5a3f28" stroke-width="1.4"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1><span class="pixel">MOTD</span> 查看器</h1>
          <p>Minecraft: Java / Bedrock · Server List Ping</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="lang-btn theme-btn" id="theme" aria-label="Switch theme">跟随系统</button>
        <button type="button" class="lang-btn" id="lang" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main class="app">
    <form class="ping-form" id="form" autocomplete="off" novalidate>
      <div class="field" id="field">
        <span class="prefix" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16l4.5 4.5"></path>
          </svg>
        </span>
        <label class="sr-only" id="addr-label" for="address">服务器地址</label>
        <input id="address" name="address" placeholder="play.example.com  或  host:25565"
               spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="url">
      </div>
      <select id="edition" class="edition" aria-label="Edition">
        <option value="java">Java</option>
        <option value="bedrock">Bedrock</option>
      </select>
      <button type="submit" id="submit"><span class="pixel">PING</span></button>
    </form>

    <div class="history" id="history" hidden>
      <span class="history-label" id="history-label">最近</span>
      <div class="chips" id="chips"></div>
    </div>

    <section class="output" id="output" aria-live="polite">
      <div class="empty" id="empty">
        <p class="empty-title">输入服务器地址，直接读取它的 MOTD</p>
        <p class="empty-sub">服务端直连 TCP 25565 · 自动 SRV 解析 · 不经过第三方 API</p>
        <div class="examples">
          <button type="button" class="example" data-address="play.cubecraft.net">play.cubecraft.net</button>
          <button type="button" class="example" data-address="mc.hypixel.net">mc.hypixel.net</button>
          <button type="button" class="example" data-address="2b2t.org">2b2t.org</button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <span id="foot-1">纯 Node.js，零依赖</span>
      <span class="dot-sep">·</span>
      <span id="foot-2">CLI 同源：<code>motd &lt;地址&gt;</code></span>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
